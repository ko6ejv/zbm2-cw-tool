name: Release
# Builds the Windows installer + a portable zip and attaches them to a GitHub Release named after
# __version__ in config.py. Runs when a v* tag is pushed, when config.py changes on main (bump the
# version to publish a new release), or by hand from the Actions tab.
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['config.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller pytest
      - run: python -m pytest -q tests/test_all.py
      - name: Build app (PyInstaller, one folder)
        run: >
          pyinstaller --noconfirm --windowed --name "ZBM2 CW Tool" --icon icon.ico
          --add-data "logo.png;." --add-data "logo_big.png;." --add-data "logo_small.png;." --add-data "icon.png;." --add-data "icon.ico;." --add-data "fonts;fonts" --add-data "models;models" --add-data "data/words.txt;data"
          --hidden-import app --hidden-import tab_chat --hidden-import tab_contest --hidden-import tab_practice --hidden-import tab_log --hidden-import simulator --hidden-import updater --hidden-import bandcond --hidden-import keyring.backends.Windows
          main.py
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}"
          if ($v -like 'v*') { $v = $v.Substring(1) }
          else { $v = (Select-String -Path config.py -Pattern "__version__ = '([^']+)'").Matches[0].Groups[1].Value }
          "v=$v" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.v }}" installer\zbm2cw.iss'
        shell: pwsh
      - name: Plain-named copy (stable 'latest' download link)
        shell: pwsh
        run: Copy-Item "installer/Output/ZBM2-CW-Tool-Setup-${{ steps.ver.outputs.v }}.exe" "installer/Output/ZBM2-CW-Tool-Setup.exe"
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path "dist\ZBM2 CW Tool\*" -DestinationPath "ZBM2-CW-Tool-${{ steps.ver.outputs.v }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            installer/Output/*.exe
            *.zip
      - name: Release notes
        shell: pwsh
        run: |
          $f = "docs/release-notes/v${{ steps.ver.outputs.v }}.md"
          if (Test-Path $f) { Copy-Item $f notes.md } else { "ZBM2 CW Tool ${{ steps.ver.outputs.v }}" | Out-File notes.md }
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          tag_name: v${{ steps.ver.outputs.v }}
          name: ZBM2 CW Tool ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          files: |
            installer/Output/*.exe
            *.zip
          generate_release_notes: true
